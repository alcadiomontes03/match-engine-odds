name: fd-history

# Pulsematch v5: pulls football-data.co.uk results + Pinnacle/market closing odds
# into data/fd/. Completed seasons are fetched once; the current season refreshes
# every Monday before the weekly refit (16:00 UTC).
on:
  push:
    branches: [main]
    paths: ["fetch_fd.py", ".github/workflows/fd-history.yml"]
  schedule:
    # Mon 06:17 and 14:17 UTC plus Tue 06:17 UTC (Monday-night games). GitHub often starts scheduled runs hours
    # late (Nov 2: 22:47 UTC), so the Monday jobs also call scripts/ensure_fd.py, which starts this workflow
    # and waits for it when no successful run exists yet that day.
    - cron: "17 6 * * 1,2"
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch football-data CSVs
        run: python fetch_fd.py
      - name: Commit
        run: |
          git config user.name "fd-bot"
          git config user.email "fd-bot@users.noreply.github.com"
          git add -A data/fd
          if ! git diff --cached --quiet; then
            git commit -m "football-data history $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
      # 2026-11-09: weekly forward-test report (docs/prereg-forward-2026-11.md). Descriptive only. Needs git
      # history back to the registration so it can time each model file by the commit that added it.
      - name: Forward test report
        if: github.event.schedule == '17 14 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch -q --shallow-since=2026-10-15 origin main || git fetch -q --unshallow origin main || true
          git pull -q --rebase || true
          pip install -q numpy scipy pandas
          python pipeline/picks/report.py || { echo "WARN forward-test report failed"; exit 0; }
          git add -A data/picks/reports
          if ! git diff --cached --quiet; then
            git commit -m "forward test report $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
