name: odds-capture

on:
  push:
    branches: [main]
    paths: ["capture_odds.py", ".github/workflows/odds.yml"]
  schedule:
    # Off the quarter-hours: GitHub drops many runs scheduled on :00/:15/:30/:45 under load
    # (Oct 4-12 2026: about one run every 3-7 hours). Spends credits only when a pull is due.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | weekly (force this week's pull) | check (free) | probe (up to 3 credits)"
        default: "check"
        required: true

permissions:
  contents: write

concurrency:
  group: odds-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BOOKMAKERS: "draftkings"   # DraftKings only (decided 2026-09-25)
          # v6.1 (2026-10-12): moneyline only in the bulk call. DraftKings never returned spreads or
          # totals there for these leagues, yet each was billed. BTTS, totals and spreads come per match
          # from the event endpoint at the first late pull (see capture_odds.py event_markets()).
          ODDS_MARKETS: "h2h"
          ODDS_BTTS: "true"
          BTTS_RESERVE: "100"
          INCLUDE_CUPS: ${{ vars.INCLUDE_CUPS || 'false' }}
          ODDS_TEAM_FILTER: ${{ vars.ODDS_TEAM_FILTER || '' }}
        run: python capture_odds.py ${{ github.event.inputs.mode || 'run' }}
      - name: v5 paper picks (only when new odds arrived)
        run: |
          if ! git diff --quiet -- data/odds/snapshots.csv; then
            pip install -q numpy scipy pandas
            python pipeline/v5/paper_picks.py
          fi
      - name: Commit captured odds
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          mkdir -p data state
          git add -A data state
          if ! git diff --cached --quiet; then
            git commit -m "odds $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
