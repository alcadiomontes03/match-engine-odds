name: odds-capture

on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 min; spends credits only for the Monday weekly pull and pre-kickoff pulls
  workflow_dispatch:
    inputs:
      mode:
        description: "run | weekly (force this week's pull) | check (free) | probe (up to 3 credits)"
        default: "check"
        required: true

permissions:
  contents: write

concurrency:
  group: odds-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BOOKMAKERS: "draftkings"   # DraftKings only (decided 2026-09-25)
          # v5 (2026-09-25): moneyline + spreads + totals in the bulk call; BTTS per event.
          # Set here rather than as a repo variable so an old ODDS_MARKETS=h2h variable can't override it.
          ODDS_MARKETS: "h2h,spreads,totals"
          ODDS_BTTS: "true"
          BTTS_RESERVE: "100"
          INCLUDE_CUPS: ${{ vars.INCLUDE_CUPS || 'false' }}
          ODDS_TEAM_FILTER: ${{ vars.ODDS_TEAM_FILTER || '' }}
        run: python capture_odds.py ${{ github.event.inputs.mode || 'run' }}
      - name: v5 paper picks (only when new odds arrived)
        run: |
          if ! git diff --quiet -- data/odds/snapshots.csv; then
            pip install -q numpy scipy pandas
            python pipeline/v5/paper_picks.py
          fi
      - name: Commit captured odds
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          mkdir -p data state
          git add -A data state
          if ! git diff --cached --quiet; then
            git commit -m "odds $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
